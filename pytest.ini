[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --strict-config --tb=short -v -m "not live" --cov=agent_runtime --cov=auth --cov=context --cov=cron_service --cov=db --cov=main --cov=notification_service --cov=onboarding_service --cov=reminder_service --cov=session_manager --cov=repos --cov=voice_agent --cov-report=term-missing --cov-fail-under=52
xfail_strict = true
markers =
    integration: Integration tests (slower)
    unit: Unit tests (fast)
    regression: Regression tests
    slow: Tests that take longer to run
    live: Tests that call external systems and may create real side effects
